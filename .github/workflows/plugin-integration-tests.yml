name: Plugin Integration Tests

on: [push]

jobs:
  integration-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    name: Java ${{ matrix.java }} Plugin Integration Tests

    steps:
    - uses: actions/checkout@v6
    - name: Setup java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Run plugin integration tests
      run: ./gradlew :gradle-plugin:integrationTest
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results-java-${{ matrix.java }}
        path: 'gradle-plugin/build/test-results/integrationTest/**/*.xml'
        retention-days: 7
